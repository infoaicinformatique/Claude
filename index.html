<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM - Gestion des Contacts</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>CRM - Gestion des Contacts</h1>
            <p>Système de gestion de la relation client</p>
        </header>

        <div class="form-section">
            <h2>Ajouter un nouveau contact</h2>
            <form id="contactForm">
                <div class="form-group">
                    <label for="prenom">Prénom *</label>
                    <input type="text" id="prenom" name="prenom" required>
                </div>

                <div class="form-group">
                    <label for="nom">Nom *</label>
                    <input type="text" id="nom" name="nom" required>
                </div>

                <div class="form-group">
                    <label for="age">Âge *</label>
                    <input type="number" id="age" name="age" min="1" max="120" required>
                </div>

                <button type="submit" class="btn-submit">Ajouter le contact</button>
            </form>
        </div>

        <div class="contacts-section">
            <div class="section-header">
                <h2>Liste des contacts</h2>
                <button id="clearAll" class="btn-clear">Tout effacer</button>
            </div>

            <div class="stats">
                <span>Total de contacts: <strong id="totalContacts">0</strong></span>
            </div>

            <div id="contactsList" class="contacts-list">
                <p class="empty-message">Aucun contact enregistré</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
